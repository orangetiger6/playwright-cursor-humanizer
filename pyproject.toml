[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "humanmouse"
version = "0.1.0"
description = "Learn human cursor movement, dragging and scrolling from recordings and replay it in Playwright"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "playwright>=1.40"]

[project.optional-dependencies]
train = ["torch>=2.2"]  # training only; the bundled model runs on numpy
eval = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["humanmouse"]

[tool.setuptools.package-data]
humanmouse = ["assets/model.npz", "assets/behavior.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
