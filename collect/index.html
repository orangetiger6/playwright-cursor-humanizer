<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mouse Recorder</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f5f2; font-family: system-ui, sans-serif; user-select: none; }
  #hud { position: fixed; top: 8px; left: 12px; font-size: 13px; color: #555; pointer-events: none; z-index: 10; }
  #save { position: fixed; top: 6px; right: 10px; font-size: 13px; z-index: 10; }
  #target { position: absolute; display: none; background: #2f6fde; border-radius: 6px; }
  #target.circle { border-radius: 50%; }
  #begin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 28px; font-size: 16px; cursor: pointer; z-index: 5; }
  #chip { position: absolute; display: none; background: #e8872b; border-radius: 8px; cursor: grab; touch-action: none; z-index: 2; }
  #zone { position: absolute; display: none; border: 2px dashed #2f6fde; border-radius: 10px; background: rgba(47, 111, 222, .06); box-sizing: border-box; }
  #scroller { position: fixed; top: 32px; left: 0; right: 0; bottom: 0; overflow-y: auto; display: none; background: #fff; }
  .row { height: 44px; line-height: 44px; padding-left: 24px; border-bottom: 1px solid #eee; box-sizing: border-box; color: #666; font-size: 14px; }
  .row.hot { background: #2f6fde; color: #fff; }
</style>
</head>
<body>
<div id="hud"></div>
<button id="save" title="Shortcut: S">Save</button>
<button id="begin">Begin</button>
<div id="target"></div>
<div id="zone"></div>
<div id="chip"></div>
<div id="scroller"></div>
<script>
// Records a mix of tasks:
//   click   move to a target and click it (the trial starts at the previous action's end point)
//   drag    carry the orange square into the dashed box
//   scroll  scroll a long list to the highlighted row and click it
// The movement to the square in a drag task is saved as an ordinary click trial too, so it
// also adds pointing data.
// ?tasks=drag,scroll restricts the mix; ?source=bot marks sessions recorded by the demo.
const params = new URLSearchParams(location.search);
const SOURCE = (params.get('source') || 'human').replace(/[^a-z0-9_-]/gi, '');
const AUTOSAVE_EVERY = 25;
// [width, height] — circles/icons plus button- and link-shaped rectangles.
const SIZES = [[12,12],[16,16],[24,24],[36,36],[56,56],[80,80],[60,20],[90,28],[140,36],[220,44]];
const WEIGHTS = { click: 0.6, drag: 0.2, scroll: 0.2 };
const ENABLED = (params.get('tasks') || Object.keys(WEIGHTS).join(',')).split(',').filter(k => k in WEIGHTS);
const MIX = Object.entries(WEIGHTS).filter(([k]) => ENABLED.includes(k));
const INSTRUCTIONS = {
  click: 'click the blue target',
  drag: 'drag the orange square into the dashed box',
  scroll: 'scroll to the blue row and click it',
};
const ROWS = 300, ROW_H = 44;

const $ = id => document.getElementById(id);
const [target, begin, hud, save, chip, zone, scroller] =
  ['target', 'begin', 'hud', 'save', 'chip', 'zone', 'scroller'].map($);
for (let i = 0; i < ROWS; i++) {
  const row = document.createElement('div');
  row.className = 'row';
  row.textContent = `Item ${i + 1}`;
  scroller.append(row);
}

let session = newSession();
let task = null;           // current task: {kind, phase, ...}
let trial = null;          // pointing movement in progress; ends with a press on `aim`
let aim = null;
let hotRow = null;
let pos = [innerWidth / 2, innerHeight / 2];
let total = 0;
const done = { drag: 0, missed: 0, scroll: 0 };  // finished tasks this page load, shown in the HUD

function newSession() {
  return {
    source: SOURCE,
    created: new Date().toISOString(),
    user_agent: navigator.userAgent,
    device_pixel_ratio: devicePixelRatio,
    viewport: [innerWidth, innerHeight],
    trials: [],
  };
}

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function pickKind() {
  let r = Math.random() * MIX.reduce((s, [, w]) => s + w, 0);
  for (const [kind, w] of MIX) if ((r -= w) < 0) return kind;
  return MIX[0][0];
}

function updateHud(msg) {
  const counts = (ENABLED.includes('drag') ? ` · drags ${done.drag}` + (done.missed ? ` (+${done.missed} missed)` : '') : '') +
    (ENABLED.includes('scroll') ? ` · scrolls ${done.scroll}` : '');
  hud.textContent = `${SOURCE} · trials this session: ${total}${counts} · unsaved: ${session.trials.length}` +
    (task ? ` · ${INSTRUCTIONS[task.kind]}` : '') + (msg ? ` · ${msg}` : '');
}

function randomBox(w, h, fromX, fromY, minDist = 60, avoid = null) {
  const m = 20, top = 40;
  let x, y;
  for (let i = 0; i < 200; i++) {
    x = m + Math.random() * (innerWidth - w - 2 * m);
    y = top + Math.random() * (innerHeight - h - m - top);
    const far = Math.hypot(x + w / 2 - fromX, y + h / 2 - fromY) > minDist;
    const clear = !avoid || x + w < avoid[0] - 20 || x > avoid[0] + avoid[2] + 20 || y + h < avoid[1] - 20 || y > avoid[1] + avoid[3] + 20;
    if (far && clear) break;
  }
  return [x, y, w, h];
}

function show(el, [x, y, w, h]) {
  Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', display: 'block' });
}

function hideAll() {
  for (const el of [target, chip, zone, scroller]) el.style.display = 'none';
  if (hotRow) {
    hotRow.classList.remove('hot');
    hotRow.textContent = `Item ${[...scroller.children].indexOf(hotRow) + 1}`;
    hotRow = null;
  }
}

function startPointing(t, x, y, el, box) {
  aim = el;
  trial = { kind: 'click', task: task.kind, start: [x, y], target_box: box, target_size: [box[2], box[3]], events: [[t, x, y]], misses: [] };
}

function nextTask(t, x, y) {
  hideAll();
  task = { kind: pickKind() };
  if (task.kind === 'click') {
    const [w, h] = pick(SIZES);
    const box = randomBox(w, h, x, y);
    show(target, box);
    target.className = w === h ? 'circle' : '';
    startPointing(t, x, y, target, box);
  } else if (task.kind === 'drag') {
    const s = 36 + Math.random() * 30, zs = s + 40 + Math.random() * 100;
    const chipBox = randomBox(s, s, x, y);
    const zoneBox = randomBox(zs, zs, chipBox[0] + s / 2, chipBox[1] + s / 2, 150, chipBox);
    show(chip, chipBox);
    show(zone, zoneBox);
    Object.assign(task, { chip: chipBox, target_box: zoneBox, target_size: [zs, zs] });
    startPointing(t, x, y, chip, chipBox);
  } else {
    startScroll(t, x, y);
  }
  updateHud();
}

function startScroll(t, x, y) {
  aim = null;
  scroller.style.display = 'block';
  const view = scroller.clientHeight, maxTop = scroller.scrollHeight - view;
  let start = 0, row = 0;
  for (let i = 0; i < 100; i++) {  // a row 400-6000 px away, up or down
    start = Math.random() * maxTop;
    const dist = Math.exp(Math.log(400) + Math.random() * Math.log(6000 / 400)) * (Math.random() < 0.5 ? -1 : 1);
    row = Math.floor((start + view * (0.2 + 0.6 * Math.random()) + dist) / ROW_H);
    if (row >= 0 && row < ROWS) break;
  }
  row = Math.min(Math.max(row, 0), ROWS - 1);
  scroller.scrollTop = start;
  hotRow = scroller.children[row];
  hotRow.classList.add('hot');
  hotRow.textContent = 'Click this row';
  Object.assign(task, {
    start: [x, y], events: [[t, x, y]], wheel: [], scroll: [[t, scroller.scrollTop]],
    row_top: row * ROW_H, start_scroll: scroller.scrollTop, view_h: view, misses: [],
  });
}

function commit(record) {
  session.trials.push(record);
  total++;
  if (record.kind === 'drag') done[record.success ? 'drag' : 'missed']++;
  if (record.kind === 'scroll') done.scroll++;
  updateHud();
  if (session.trials.length >= AUTOSAVE_EVERY) saveSession();
}

function abort() {
  trial = task = aim = null;
  hideAll();
  begin.style.display = 'block';
  updateHud();
}

async function saveSession() {
  if (!session.trials.length) return { saved: null, trials: 0 };
  const payload = session;
  session = newSession();
  try {
    const res = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const out = await res.json();
    updateHud(`saved ${out.saved}`);
    return out;
  } catch (err) {
    session.trials = payload.trials.concat(session.trials);  // keep data if the save failed
    updateHud('SAVE FAILED — is server.py running?');
    throw err;
  }
}
window.saveSession = saveSession;
window.currentTask = () => task && { kind: task.kind, phase: task.phase || null };

addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const pts = (evs.length ? evs : [e]).map(c => [c.timeStamp, c.clientX, c.clientY]);
  pos = [e.clientX, e.clientY];
  if (trial) {
    trial.events.push(...pts);
  } else if (task && task.phase === 'dragging') {
    task.events.push(...pts);
    Object.assign(chip.style, { left: e.clientX - task.grab[0] + 'px', top: e.clientY - task.grab[1] + 'px' });
  } else if (task && task.kind === 'scroll') {
    task.events.push(...pts);
  }
});

addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  const t = e.timeStamp, x = e.clientX, y = e.clientY;
  if (e.target === begin) {
    begin.style.display = 'none';
    nextTask(t, x, y);
    return;
  }
  if (e.target === save) { abort(); saveSession(); return; }
  if (trial) {
    if (e.target !== aim) { trial.misses.push([t, x, y]); return; }
    trial.events.push([t, x, y]);
    trial.click = [t, x, y];
    commit(trial);
    trial = null;
    if (task.kind === 'click') {
      nextTask(t, x, y);
    } else if (task.kind === 'drag') {
      chip.setPointerCapture(e.pointerId);
      Object.assign(task, { phase: 'dragging', start: [x, y], press: [t, x, y], events: [[t, x, y]], grab: [x - task.chip[0], y - task.chip[1]] });
    }
    return;
  }
  if (task && task.kind === 'scroll') {
    if (e.target !== hotRow) { task.misses.push([t, x, y]); return; }
    task.events.push([t, x, y]);
    task.click = [t, x, y];
    commit(task);
    nextTask(t, x, y);
  }
});

addEventListener('pointerup', e => {
  if (!task || task.phase !== 'dragging' || e.button !== 0) return;
  const t = e.timeStamp, x = e.clientX, y = e.clientY, z = task.target_box;
  task.events.push([t, x, y]);
  task.release = [t, x, y];
  const cx = x - task.grab[0] + task.chip[2] / 2, cy = y - task.grab[1] + task.chip[3] / 2;  // square's center
  task.success = cx >= z[0] && cx <= z[0] + z[2] && cy >= z[1] && cy <= z[1] + z[3];
  delete task.phase;
  commit(task);
  nextTask(t, x, y);
});

addEventListener('keydown', e => {
  if (e.key === 's' || e.key === 'S') saveSession();
});

addEventListener('wheel', e => {
  if (e.ctrlKey) e.preventDefault();  // trackpad pinch would zoom the page and break coordinates
  if (task && task.kind === 'scroll') task.wheel.push([e.timeStamp, e.deltaX, e.deltaY, e.deltaMode, e.clientX, e.clientY]);
}, { passive: false });

scroller.addEventListener('scroll', () => {
  if (task && task.kind === 'scroll') task.scroll.push([performance.now(), scroller.scrollTop]);
});

// Losing focus mid-trial produces unnatural data; throw the task away.
addEventListener('blur', abort);
document.addEventListener('visibilitychange', () => { if (document.hidden) abort(); });
addEventListener('beforeunload', () => {
  if (session.trials.length) navigator.sendBeacon('/save', JSON.stringify(session));
});
updateHud();
</script>
</body>
</html>
